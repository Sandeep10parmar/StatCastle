name: build-and-deploy
# Match data is no longer scraped in CI - CricClubs' Cloudflare protection
# blocks the automated browser entirely (see cricclubs_export.py). Raw match
# data under cricclubs_export_out/ is committed to the repo (added manually
# via pdf_ingest.py from CricClubs' own per-match PDF export), and this
# workflow just runs analyze.py against it and deploys the result. No
# schedule trigger: nothing changes here without a push adding new match data.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual run from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            echo "Using requirements.lock.txt"
            pip install -r requirements.lock.txt
          else
            echo "Using requirements.txt"
            pip install -r requirements.txt
          fi
          python -c "import yaml; print('PyYAML OK:', yaml.__version__)"
      - name: Verify config.yaml exists
        run: |
          if [ -f config.yaml ]; then
            echo "✓ config.yaml found"
            echo "Team name: $(grep '^team_name:' config.yaml | cut -d'"' -f2)"
          else
            echo "✗ config.yaml not found!"
            exit 1
          fi
      - name: Verify committed match data exists
        run: |
          if ls cricclubs_export_out/*/matches.json 1> /dev/null 2>&1; then
            echo "✓ Match data found:"
            ls -lh cricclubs_export_out/*/matches.json
          else
            echo "✗ No match data found in cricclubs_export_out/!"
            echo "Match data is committed to the repo (see AGENTS.md) - add it via pdf_ingest.py, not scraped in CI."
            exit 1
          fi
      - name: Build dashboard & PDF
        run: |
          echo "Starting analysis..."
          python analyze.py
          echo ""
          echo "Analysis completed. Checking for generated files..."
          if ls team_dashboard/assets/*.json 1> /dev/null 2>&1; then
            echo "✓ JSON files generated:"
            ls -lh team_dashboard/assets/*.json
            echo ""
            echo "Checking file contents:"
            for file in team_dashboard/assets/*.json; do
              if [ -f "$file" ]; then
                size=$(wc -c < "$file")
                echo "  $(basename $file): $size bytes"
                if [ "$size" -lt 50 ]; then
                  echo "    ⚠️  WARNING: File is very small, showing content:"
                  cat "$file"
                fi
              fi
            done
          else
            echo "✗ No JSON files generated!"
            exit 1
          fi
      - name: Verify generated files before upload
        run: |
          echo "=== Checking generated files ==="
          echo "Files in team_dashboard/assets/:"
          ls -lh team_dashboard/assets/*.json 2>/dev/null || echo "No JSON files found"
          echo ""
          echo "File sizes:"
          for file in team_dashboard/assets/*.json; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              echo "  $(basename $file): $size bytes"
              if [ "$size" -lt 10 ]; then
                echo "    ⚠️  WARNING: File is very small (likely empty)"
              else
                echo "    ✓ File has content"
              fi
            fi
          done
          echo ""
          echo "Sample of match_results.json (first 500 chars):"
          head -c 500 team_dashboard/assets/match_results.json 2>/dev/null || echo "File not found"
          echo ""
          echo ""
          echo "Checking if match_results.json has actual data:"
          if [ -f team_dashboard/assets/match_results.json ]; then
            match_count=$(python3 -c "import json; f=open('team_dashboard/assets/match_results.json'); data=json.load(f); print(len(data))" 2>/dev/null || echo "0")
            echo "  Match count in JSON: $match_count"
            if [ "$match_count" = "0" ]; then
              echo "  ⚠️  WARNING: match_results.json is empty array"
            fi
          fi
      - name: Upload dashboard artifact (for Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./team_dashboard
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: team-dashboard
          path: |
            team_dashboard/index.html
            team_dashboard/assets/*

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
